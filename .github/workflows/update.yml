name: Collect, verify and publish Sports Lab
on:
  workflow_dispatch:
  schedule:
    # Asia/Taipei 07:00, 14:00, 21:00 (UTC 23:00, 06:00, 13:00).
    - cron: '0 23,6,13 * * *'
  push:
    branches: [main]
    paths: ['public/**', 'lib/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/update.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sports-lab-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore bounded source caches
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sports-cache-${{ github.run_id }}
          restore-keys: sports-cache-
      - name: Collect public sources (90 second request budget)
        run: npm run collect
        timeout-minutes: 2
      - name: Test failure recovery, identity, time and conflicts
        run: npm test
      - name: Validate snapshot and build static website
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish exact validated website
        id: publish
        uses: actions/deploy-pages@v4
      - name: Preserve normalized snapshot after successful deployment
        run: |
          git config user.name "sports-lab-bot"
          git config user.email "sports-lab-bot@users.noreply.github.com"
          git add data/dashboard.json
          if ! git diff --staged --quiet; then
            git commit -m "data: preserve verified Sports Lab snapshot"
            git push origin HEAD:main
          fi
      - name: Retain collection receipt even if a later phase fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports-lab-receipt-${{ github.run_id }}
          path: |
            data/progress.json
            data/runs/
          retention-days: 14
          if-no-files-found: warn
